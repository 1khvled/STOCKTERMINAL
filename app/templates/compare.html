<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Compare // StockerAI - Free Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="/static/css/dashboard_new.css?v=12"/>
<style>
.cmp-wrap{max-width:1200px;margin:0 auto;padding:18px 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:var(--panel);font-family:JetBrains Mono,monospace;font-size:12px;font-weight:700}
.chip.missing{border-color:rgba(255,59,48,.4);color:var(--red)}
.chip button{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1}
.chip button:hover{color:var(--red)}
td.win{background:rgba(52,199,89,.10)!important;font-weight:700}
td.lose{opacity:.75}
.grp td{font-family:JetBrains Mono,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel2,#15171a)!important;padding:10px 8px 6px!important}
</style>
</head>
<body>
<nav>
  <div class="logo">STOCKER<span>AI</span> <span style="font-family:JetBrains Mono,monospace;font-size:11px;color:var(--muted);font-weight:400;margin-left:6px">COMPARE</span></div>
  <div class="nav-actions">
    <a href="/" class="btn">HUB</a>
    <a href="/guide" class="btn">GUIDE</a>
  </div>
</nav>
<div class="cmp-wrap">
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Compare stocks head-to-head</h1>
  <div class="card">
    <div class="card-title">Peer Comparison Matrix <span style="margin-left:auto;font-size:10px">max 6 tickers</span></div>
    <div class="row" style="display:flex;gap:10px;flex-wrap:wrap">
      <input id="ticker" class="inp" placeholder="Add ticker: AAPL + Enter" autocomplete="off" spellcheck="false" style="flex:1;min-width:200px;background:#0a0a0b;border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;font-family:JetBrains Mono,monospace;outline:none"/>
      <button id="add" class="btn btn-primary">ADD</button>
      <button id="clear" class="btn">CLEAR</button>
      <button id="copylink" class="btn">COPY LINK</button>
    </div>
    <div id="chips" class="chips"></div>
    <div id="msg" class="small" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
  </div>
  <div id="empty" class="card" style="text-align:center;color:var(--muted)">Add 2+ analyzed tickers to compare. Unanalyzed tickers show as missing — analyze them from the hub first.</div>
  <div id="result" style="display:none">
    <div class="card"><div class="card-title">Head-to-head (green = best in row)</div>
      <div style="overflow:auto"><table class="table" id="cmp-table"><thead><tr id="cmp-head"></tr></thead><tbody id="cmp-body"></tbody></table></div>
    </div>
    <div class="grid2">
      <div class="card"><div class="card-title">Quality Radar (normalized 0-100)</div><canvas id="cmp-radar" height="220"></canvas></div>
      <div class="card"><div class="card-title">Fair Value vs Price</div><canvas id="cmp-bars" height="220"></canvas></div>
    </div>
  </div>
</div>
<script src="/static/js/toast.js"></script>
<script>if(typeof showToast==="undefined"){function showToast(m){alert(m);}}</script>
<script>
let tickers=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>(v==null||v===""||isNaN(Number(v)))?null:Number(v);
const money=v=>v==null?"--":"$"+(Math.abs(v)>=1e12?(v/1e12).toFixed(2)+"T":Math.abs(v)>=1e9?(v/1e9).toFixed(2)+"B":Math.abs(v)>=1e6?(v/1e6).toFixed(2)+"M":v.toLocaleString());
const mult=v=>v==null?"--":v.toFixed(1)+"x";
const pct1=v=>v==null?"--":((v*100>=0?"+":"")+(v*100).toFixed(1)+"%");

function syncUrl(){const u=new URL(location.href);if(tickers.length)u.searchParams.set("tickers",tickers.join(","));else u.searchParams.delete("tickers");history.replaceState({},"",u);}
function renderChips(missing){
  $("chips").innerHTML=tickers.map(t=>{
    const miss=missing&&missing.includes(t);
    return `<span class="chip${miss?" missing":""}">${t}${miss?" (not analyzed)":""}<button onclick="rmTicker('${t}')" title="remove">&times;</button></span>`;
  }).join("");
}
function rmTicker(t){tickers=tickers.filter(x=>x!==t);syncUrl();load();}
function addTicker(){
  const v=$("ticker").value.trim().toUpperCase();$("ticker").value="";
  if(!v)return;
  if(!/^[A-Z0-9.\^-]{1,12}$/.test(v)){showToast("Invalid ticker","error");return;}
  if(tickers.includes(v)){showToast(v+" already added","warn");return;}
  if(tickers.length>=6){showToast("Max 6 tickers","error");return;}
  tickers.push(v);syncUrl();load();
}
$("add").onclick=addTicker;
$("ticker").addEventListener("keydown",e=>{if(e.key==="Enter")addTicker();});
$("clear").onclick=()=>{tickers=[];syncUrl();load();};
$("copylink").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);showToast("Link copied","success");}catch(e){showToast(location.href,"info");}};

async function load(){
  renderChips([]);
  if(!tickers.length){$("empty").style.display="block";$("result").style.display="none";$("msg").innerText="";return;}
  $("msg").innerText="Loading "+tickers.join(", ")+"...";
  let rows=[];
  try{
    const r=await fetch("/api/compare?tickers="+tickers.join(","));
    const j=await r.json();
    rows=j.stocks||[];
  }catch(e){showToast("Compare fetch failed","error");return;}
  const have=new Set(rows.map(s=>s.ticker));
  const missing=tickers.filter(t=>!have.has(t));
  renderChips(missing);
  // enrich with full multiples from stock records (best effort)
  const full={};
  await Promise.allSettled(rows.map(s=>fetch("/api/stock/"+s.ticker).then(r=>r.ok?r.json():null).then(d=>{if(d)full[s.ticker]=d;})));
  const data=rows.map(s=>({sum:s,det:(full[s.ticker]||{}).key_metrics||{}}));
  try{
    const lr=await fetch("/api/stocks/live-quotes?tickers="+tickers.join(","));const lj=await lr.json();
    const lm={};(lj.quotes||[]).forEach(q=>{lm[q.ticker]=q;});
    data.forEach(s=>{const q=lm[s.sum.ticker];
      if(q&&q.price&&q.source&&q.source.charCodeAt(0)===121){
        s.sum=Object.assign({},s.sum,{current_price:q.price,
          upside:(s.sum.fair_value_mid&&q.price)?((s.sum.fair_value_mid-q.price)/q.price):s.sum.upside});}});
  }catch(e){}
  if(!data.length){
    $("empty").style.display="block";$("result").style.display="none";
    $("msg").innerText="None of these are analyzed yet. Go to the hub and ANALYZE first: "+missing.join(", ");
    return;
  }
  $("empty").style.display="none";$("result").style.display="block";
  $("msg").innerText=missing.length?("Missing (not analyzed): "+missing.join(", ")):(data.length+" tickers compared");
  renderTable(data);
  renderRadar(data);
  renderBars(data);
}

const ROWS=[
 {g:"VALUATION"},
 {l:"Company",get:s=>`<a href="/dashboard/${s.sum.ticker}" style="color:var(--green)">${esc(s.sum.company_name||s.sum.ticker)}</a>`,raw:s=>s.sum.company_name},
 {l:"Price",get:s=>s.sum.current_price? "$"+s.sum.current_price.toFixed(2):"--",raw:s=>s.sum.current_price,dir:0},
 {l:"Fair Value",get:s=>s.sum.fair_value_mid?"$"+s.sum.fair_value_mid.toFixed(2):"--",raw:s=>s.sum.fair_value_mid,dir:0},
 {l:"Upside",get:s=>{const u=s.sum.upside;return u==null?"--":`<span style="color:${u>=0?'var(--green)':'var(--red)'}">${pct1(u)}</span>`;},raw:s=>s.sum.upside,dir:1},
 {l:"Verdict",get:s=>{const v=(s.sum.verdict||"HOLD");const c=v.includes("BUY")?"badge-buy":v.includes("SELL")?"badge-sell":"badge-hold";return `<span class="badge ${c}">${v}</span>`;},raw:s=>s.sum.verdict,dir:0},
 {g:"MULTIPLES"},
 {l:"P/E trail",get:s=>mult(num(s.det.trailingPE)),raw:s=>num(s.det.trailingPE),dir:-1},
 {l:"P/E fwd",get:s=>mult(num(s.det.forwardPE)),raw:s=>num(s.det.forwardPE),dir:-1},
 {l:"P/S",get:s=>mult(num(s.det.priceToSalesTrailing12Months)),raw:s=>num(s.det.priceToSalesTrailing12Months),dir:-1},
 {l:"P/B",get:s=>mult(num(s.det.priceToBook)),raw:s=>num(s.det.priceToBook),dir:-1},
 {l:"EV/EBITDA",get:s=>mult(num(s.det.enterpriseToEbitda)),raw:s=>num(s.det.enterpriseToEbitda),dir:-1},
 {g:"QUALITY & GROWTH"},
 {l:"ROE",get:s=>s.sum.returnOnEquity==null?"--":(s.sum.returnOnEquity*100).toFixed(1)+"%",raw:s=>s.sum.returnOnEquity,dir:1},
 {l:"ROA",get:s=>s.sum.returnOnAssets==null?"--":(s.sum.returnOnAssets*100).toFixed(1)+"%",raw:s=>s.sum.returnOnAssets,dir:1},
 {l:"Op Margin",get:s=>s.sum.operatingMargins==null?"--":(s.sum.operatingMargins*100).toFixed(1)+"%",raw:s=>s.sum.operatingMargins,dir:1},
 {l:"Rev Growth",get:s=>s.sum.revenueGrowth==null?"--":(s.sum.revenueGrowth*100).toFixed(1)+"%",raw:s=>s.sum.revenueGrowth,dir:1},
 {l:"FCF",get:s=>money(s.sum.freeCashflow),raw:s=>s.sum.freeCashflow,dir:1},
 {l:"Market Cap",get:s=>money(s.sum.marketCap),raw:s=>s.sum.marketCap,dir:1},
 {g:"RISK"},
 {l:"Debt/Equity",get:s=>s.sum.debtToEquity==null?"--":s.sum.debtToEquity.toFixed(1)+"x",raw:s=>s.sum.debtToEquity,dir:-1},
 {l:"Altman Z",get:s=>s.sum.altman_z==null?"--":s.sum.altman_z,raw:s=>num(s.sum.altman_z),dir:1},
 {l:"Piotroski",get:s=>s.sum.piotroski_f==null?"--":s.sum.piotroski_f+"/9",raw:s=>s.sum.piotroski_f,dir:1},
];

function renderTable(data){
  $("cmp-head").innerHTML="<th>Metric</th>"+data.map(s=>`<th>${s.sum.ticker}</th>`).join("");
  let h="";
  ROWS.forEach(r=>{
    if(r.g){h+=`<tr class="grp"><td colspan="${data.length+1}">${r.g}</td></tr>`;return;}
    const vals=data.map(s=>{try{return r.raw(s);}catch(e){return null;}});
    const nums=vals.filter(v=>typeof v==="number"&&Number.isFinite(v));
    let best=null;
    if(r.dir!==0&&nums.length>1){best=r.dir===1?Math.max(...nums):Math.min(...nums);}
    h+="<tr><td>"+r.l+"</td>"+data.map((s,i)=>{
      const win=best!==null&&vals[i]===best;
      return `<td class="${win?"win":""}">${r.get(s)}</td>`;
    }).join("")+"</tr>";
  });
  $("cmp-body").innerHTML=h;
}

function renderRadar(data){
  const cv=$("cmp-radar");if(!cv||typeof Chart==="undefined")return;
  const norm=(arr)=>{const ns=arr.filter(v=>typeof v==="number"&&Number.isFinite(v));if(ns.length<2)return arr.map(()=>50);
    const mn=Math.min(...ns),mx=Math.max(...ns);if(mx===mn)return arr.map(()=>50);
    const srt=[...ns].sort((a,b)=>a-b),med=srt[Math.floor(srt.length/2)],medN=Math.round((med-mn)/(mx-mn)*100);
    return arr.map(v=>(typeof v!=="number"||!Number.isFinite(v))?medN:Math.round((v-mn)/(mx-mn)*100));};
  const ups=data.map(s=>s.sum.upside),roe=data.map(s=>s.sum.returnOnEquity),gr=data.map(s=>s.sum.revenueGrowth),
        alt=data.map(s=>num(s.sum.altman_z)),pio=data.map(s=>s.sum.piotroski_f);
  if(window._cmpRadar)window._cmpRadar.destroy();
  window._cmpRadar=new Chart(cv,{type:'radar',
    data:{labels:["Upside","ROE","Growth","Safety","Quality"],
      datasets:data.map((s,i)=>({label:s.sum.ticker,data:[norm(ups)[i],norm(roe)[i],norm(gr)[i],norm(alt)[i],norm(pio.map(v=>v==null?null:v/9))[i]],
        borderColor:i===0?"#34c759":"#0a84ff",backgroundColor:i===0?"rgba(52,199,89,.15)":"rgba(10,132,255,.12)",pointRadius:2}))},
    options:{responsive:true,plugins:{legend:{labels:{color:'#8a8d93',font:{size:10}}}},
      scales:{r:{min:0,max:100,ticks:{display:false},grid:{color:'#1e1f23'},angleLines:{color:'#1e1f23'},pointLabels:{color:'#8a8d93',font:{size:10}}}}}});
}

function renderBars(data){
  const cv=$("cmp-bars");if(!cv||typeof Chart==="undefined")return;
  if(window._cmpBars)window._cmpBars.destroy();
  window._cmpBars=new Chart(cv,{type:'bar',
    data:{labels:data.map(s=>s.sum.ticker),datasets:[
      {label:'Price',data:data.map(s=>s.sum.current_price||0),backgroundColor:'rgba(10,132,255,.6)'},
      {label:'Fair Value',data:data.map(s=>s.sum.fair_value_mid||0),backgroundColor:'rgba(52,199,89,.6)'}]},
    options:{responsive:true,plugins:{legend:{labels:{color:'#8a8d93',font:{size:10}}}},
      scales:{x:{ticks:{color:'#8a8d93',font:{size:10}}},y:{grid:{color:'#1e1f23'},ticks:{color:'#8a8d93',font:{size:9},callback:v=>'$'+v}}}}});
}

(function init(){
  const q=new URLSearchParams(location.search).get("tickers");
  if(q)tickers=q.split(",").map(s=>s.trim().toUpperCase()).filter(Boolean).slice(0,6);
  load();
})();
</script>
</body>
</html>
