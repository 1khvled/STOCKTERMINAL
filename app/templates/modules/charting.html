<div class="module-animated" style="height: 100%; display: flex; flex-direction: column;">
  <!-- Header -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-shrink: 0; padding: 4px;">
    <div>
      <h1 class="glow-text" style="font-size: 1.8rem; margin: 0;">Advanced Charting</h1>
      <p style="color: var(--fiscal-text-secondary); font-size: 0.9rem; margin-top: 4px;">
        Institutional-grade technical analysis
      </p>
    </div>
    <div style="display: flex; gap: 8px;">
      <select id="chart-layout-select" class="fiscal-search-input" style="width: auto; background: var(--fiscal-bg-card); color: var(--fiscal-text-primary); border: 1px solid var(--fiscal-border-light); padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; outline: none;" onchange="window.ChartingController.updateLayout(this.value)">
        <option value="1">Single Chart</option>
        <option value="2h">2 Charts (Horizontal)</option>
        <option value="2v">2 Charts (Vertical)</option>
        <option value="4">4 Charts (Grid)</option>
      </select>
    </div>
  </div>

  <!-- Charts Grid Container -->
  <div id="tv-grid-container" style="flex: 1; display: grid; gap: 12px; grid-template-columns: 1fr; grid-template-rows: 1fr;">
    <div id="tv-chart-1" class="glass-panel" style="overflow: hidden; width: 100%; height: 100%;"></div>
    <div id="tv-chart-2" class="glass-panel" style="overflow: hidden; width: 100%; height: 100%; display: none;"></div>
    <div id="tv-chart-3" class="glass-panel" style="overflow: hidden; width: 100%; height: 100%; display: none;"></div>
    <div id="tv-chart-4" class="glass-panel" style="overflow: hidden; width: 100%; height: 100%; display: none;"></div>
  </div>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
  (function () {
    const chartCtrl = window.ChartingController;
    if (chartCtrl) chartCtrl.init(window.App, window.App.state.activeTicker);
  })();
</script>
