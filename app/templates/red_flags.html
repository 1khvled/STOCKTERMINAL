<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockerAI // Red Flag Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/index.css">
    <link rel="stylesheet" href="/static/css/terminal_shell.css">
    <style>
        .flags-wrapper {
            padding: 32px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .summary-banner {
            display: flex;
            gap: 16px;
            margin-bottom: 8px;
        }
        .summary-card {
            flex: 1;
            background: var(--bg-panel, #141518);
            border: 1px solid var(--border, rgba(255,255,255,0.09));
            border-radius: var(--radius-md, 8px);
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }
        .summary-card.critical {
            border-top: 3px solid var(--ruby, #ff453a);
        }
        .summary-card.warning {
            border-top: 3px solid var(--gold, #ff9f0a);
        }
        .summary-card.safe {
            border-top: 3px solid var(--emerald, #30d158);
        }
        .summary-count {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
        }
        .summary-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .flags-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .ticker-flag-card {
            background: var(--bg-panel, #141518);
            border: 1px solid var(--border, rgba(255,255,255,0.09));
            border-radius: var(--radius-md, 8px);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: border-color var(--ease-fast);
        }
        .ticker-flag-card:hover {
            border-color: var(--border-strong, rgba(255,255,255,0.18));
        }
        .ticker-flag-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }
        .ticker-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ticker-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: var(--text-md);
            font-weight: 700;
            background: #fff;
            color: #000;
            padding: 4px 10px;
            border-radius: var(--radius-xs);
        }
        .company-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
        }
        .severity-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: var(--radius-xs);
            text-transform: uppercase;
        }
        .severity-critical {
            background: rgba(255, 69, 58, 0.1);
            border: 1px solid rgba(255, 69, 58, 0.25);
            color: var(--ruby);
        }
        .severity-warning {
            background: rgba(255, 159, 10, 0.1);
            border: 1px solid rgba(255, 159, 10, 0.25);
            color: var(--gold);
        }
        .severity-safe {
            background: rgba(48, 209, 88, 0.1);
            border: 1px solid rgba(48, 209, 88, 0.25);
            color: var(--emerald);
        }
        .alerts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }
        .alert-pill {
            background: var(--surface-3, #1c1d21);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm, 5px);
            padding: 12px 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: var(--text-sm);
        }
        .alert-pill.critical-pill {
            border-left: 3px solid var(--ruby);
        }
        .alert-pill.warning-pill {
            border-left: 3px solid var(--gold);
        }
        .alert-pill.safe-pill {
            border-left: 3px solid var(--emerald);
        }
        .alert-icon {
            font-size: 1.1rem;
            line-height: 1;
        }
        .alert-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .alert-title {
            font-weight: 700;
            color: #fff;
        }
        .alert-desc {
            color: var(--text-muted);
            font-size: 0.76rem;
            line-height: 1.3;
        }
    </style>
</head>
<body class="terminal-shell">
<div class="main-content" style="padding: 0; gap: 0; margin-left: 0;">

    <!-- Header Bar -->
    <div style="background: #000; border-bottom: 1px solid #222; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
        <div style="display: flex; align-items: center; gap: 16px;">
            <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.85rem; background: #fff; color: #000; padding: 2px 8px; border-radius: 3px;">S_AI</span>
            <span style="font-size: 1rem; font-weight: 700; color: #fff;">StockerAI Terminal</span>
            <span class="logo-tag" style="background: rgba(255,69,58,0.1); border-color: rgba(255,69,58,0.3); color: var(--ruby);">Red Flag Detector</span>
        </div>
        <a href="/" class="btn btn-sm">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Back to Hub
        </a>
    </div>

    <!-- Flags Wrapper -->
    <div class="flags-wrapper">
        <!-- Dashboard Toolbar -->
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 style="font-size: 1.5rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; margin-bottom: 4px;">Systemic Risk & Red Flags</h1>
                <p style="font-size: var(--text-sm); color: var(--text-muted);">Real-time quantitative screening across Altman Z, Beneish M, balance sheet leverage, and AI sell indicators.</p>
            </div>
            <button class="btn btn-primary btn-sm" onclick="scanUniverse()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                Rescan Universe
            </button>
        </div>

        <!-- Summary Banner -->
        <div class="summary-banner">
            <div class="summary-card critical">
                <div class="summary-count" id="count-critical">0</div>
                <div class="summary-label">Critical Risks</div>
            </div>
            <div class="summary-card warning">
                <div class="summary-count" id="count-warnings">0</div>
                <div class="summary-label">Warning Risks</div>
            </div>
            <div class="summary-card safe">
                <div class="summary-count" id="count-safe">0</div>
                <div class="summary-label">Safe Assets</div>
            </div>
        </div>

        <!-- Risks Section -->
        <div class="flags-list" id="flags-container">
            <div style="padding: 40px; text-align: center; color: var(--text-muted);">Scanning cash flows and solvency metrics...</div>
        </div>
    </div>
</div>

<script>
    async function scanUniverse() {
        const container = document.getElementById('flags-container');
        container.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted);">Rescanning cash flows and solvency metrics...</div>';
        
        try {
            const res = await fetch('/api/stocks');
            const data = await res.json();
            const stocks = data.stocks || [];
            
            if (stocks.length === 0) {
                container.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted);">No analyzed stocks in database. Return to Hub and analyze tickers to populate.</div>';
                return;
            }
            
            let criticalCount = 0;
            let warningCount = 0;
            let safeCount = 0;
            
            const processedStocks = stocks.map(stock => {
                const flags = [];
                
                // 1. Altman Z-Score Risk (Critical if < 1.81)
                const z = parseFloat(stock.altman_z);
                if (!isNaN(z)) {
                    if (z < 1.81) {
                        flags.push({
                            type: 'critical',
                            title: 'Altman Z Distress Zone',
                            desc: `Score of ${z.toFixed(2)} indicates highly elevated probability of corporate bankruptcy within 24 months.`
                        });
                    } else if (z < 2.99) {
                        flags.push({
                            type: 'warning',
                            title: 'Altman Z Grey Zone',
                            desc: `Score of ${z.toFixed(2)} indicates caution. Standard cautionary grey zone buffer.`
                        });
                    }
                }
                
                // 2. Beneish M-Score Earnings Manipulation Risk (Critical if > -1.78)
                const m = parseFloat(stock.beneish_m);
                if (!isNaN(m)) {
                    if (m > -1.78) {
                        flags.push({
                            type: 'critical',
                            title: 'Beneish Earnings Manipulation',
                            desc: `Score of ${m.toFixed(2)} is above threshold (-1.78). High statistical likelihood of accounting manipulation.`
                        });
                    } else if (m > -2.22) {
                        flags.push({
                            type: 'warning',
                            title: 'Beneish Aggressive Accounting',
                            desc: `Score of ${m.toFixed(2)} is inside warning zone (-2.22 to -1.78). Suspect earnings accruals.`
                        });
                    }
                }
                
                // 3. Balance Sheet Leverage (Warning if Debt/Equity ratio > 3.0 or 300%)
                const de = parseFloat(stock.debtToEquity);
                if (!isNaN(de)) {
                    const deRatio = de > 10 ? de / 100 : de; // normalizes percentage vs raw decimal
                    if (deRatio > 3.0) {
                        flags.push({
                            type: 'warning',
                            title: 'Elevated Leverage (D/E)',
                            desc: `Debt to Equity ratio is ${(deRatio * 100).toFixed(1)}%, signaling potential debt service risks.`
                        });
                    }
                }
                
                // 4. Piotroski Weak F-Score (Warning if F-Score < 3)
                const f = parseInt(stock.piotroski_f);
                if (!isNaN(f)) {
                    if (f <= 3) {
                        flags.push({
                            type: 'warning',
                            title: 'Weak Piotroski F-Score',
                            desc: `Score of ${f}/9 indicates severe operational and balance-sheet weakness.`
                        });
                    }
                }
                
                // 5. Negative Free Cash Flow (Warning if cashflow < 0)
                const fcf = parseFloat(stock.freeCashflow);
                if (!isNaN(fcf) && fcf < 0) {
                    flags.push({
                        type: 'warning',
                        title: 'Negative Free Cash Flow',
                        desc: `FCF is negative, requiring outside financing to sustain operations.`
                    });
                }
                
                // 6. High AI Sell Conviction (Critical if Verdict is strong sell or sell)
                const verdict = stock.verdict.toUpperCase();
                if (verdict.includes('STRONG SELL') || verdict === 'SELL') {
                    flags.push({
                        type: 'critical',
                        title: 'AI Conviction Sell Signal',
                        desc: `StockerAI engine issued a ${verdict} valuation rating.`
                    });
                }
                
                // 7. Stale Data Warning (Warning if data older than 7 days)
                if (stock.generated_at) {
                    const ageDays = (Date.now() - new Date(stock.generated_at)) / 86400000;
                    if (ageDays > 7) {
                        flags.push({
                            type: 'warning',
                            title: 'Stale Report Data',
                            desc: `Analysis generated ${Math.floor(ageDays)} days ago. Screen variables may be outdated.`
                        });
                    }
                }
                
                // Categorize stock overall
                let overallSeverity = 'safe';
                if (flags.some(f => f.type === 'critical')) {
                    overallSeverity = 'critical';
                    criticalCount++;
                } else if (flags.some(f => f.type === 'warning')) {
                    overallSeverity = 'warning';
                    warningCount++;
                } else {
                    safeCount++;
                }
                
                return {
                    ...stock,
                    flags,
                    severity: overallSeverity
                };
            });
            
            // Update counts in UI
            document.getElementById('count-critical').innerText = criticalCount;
            document.getElementById('count-warnings').innerText = warningCount;
            document.getElementById('count-safe').innerText = safeCount;
            
            // Sort: Critical first, then Warning, then Safe
            processedStocks.sort((a, b) => {
                const sevMap = { critical: 3, warning: 2, safe: 1 };
                if (sevMap[a.severity] !== sevMap[b.severity]) {
                    return sevMap[b.severity] - sevMap[a.severity];
                }
                return b.flags.length - a.flags.length; // Sort by number of flags inside same severity
            });
            
            // Render
            container.innerHTML = '';
            processedStocks.forEach(stock => {
                const card = document.createElement('div');
                card.className = `ticker-flag-card`;
                
                const badgeClass = `severity-${stock.severity}`;
                const badgeLabel = stock.severity === 'critical' ? '🔴 CRITICAL RISK' : 
                                   stock.severity === 'warning' ? '🟡 WARNING' : '🟢 SAFE';
                                   
                let alertsHtml = '';
                if (stock.flags.length > 0) {
                    alertsHtml = `
                        <div class="alerts-grid">
                            ${stock.flags.map(f => `
                                <div class="alert-pill ${f.type}-pill">
                                    <span class="alert-icon">${f.type === 'critical' ? '🔴' : '⚠️'}</span>
                                    <div class="alert-content">
                                        <span class="alert-title">${f.title}</span>
                                        <span class="alert-desc">${f.desc}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    alertsHtml = `
                        <div class="alerts-grid">
                            <div class="alert-pill safe-pill" style="grid-column: 1 / -1;">
                                <span class="alert-icon">🟢</span>
                                <div class="alert-content">
                                    <span class="alert-title">Clean Audit Verdict</span>
                                    <span class="alert-desc">All screening metrics are within safe range parameters. Altman Z is safe, Beneish M shows no manipulation signals, and debt ratios are stable.</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                card.innerHTML = `
                    <div class="ticker-flag-header">
                        <div class="ticker-info">
                            <span class="ticker-badge">${stock.ticker}</span>
                            <span class="company-name">${stock.company_name}</span>
                        </div>
                        <div>
                            <span class="severity-badge ${badgeClass}">${badgeLabel}</span>
                        </div>
                    </div>
                    ${alertsHtml}
                `;
                
                container.appendChild(card);
            });
            
        } catch (e) {
            console.error(e);
            container.innerHTML = `<div style="padding: 40px; text-align: center; color: var(--ruby);">Failed to screen universe: ${e.message}</div>`;
        }
    }
    
    // Load on start
    document.addEventListener('DOMContentLoaded', scanUniverse);
</script>
<script src="/static/js/terminal.js"></script>
</body>
</html>
