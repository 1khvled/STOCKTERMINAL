<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockerAI Terminal // Market Command</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/fiscal_theme.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/fiscal_app.js"></script>
    <script src="/static/js/dashboard_controller.js"></script>
    <script src="/static/js/analysis_controller.js"></script>
    <script src="/static/js/charting_controller.js"></script>
    <script src="/static/js/screener_controller.js"></script>
    <script src="/static/js/query_controller.js"></script>
    <script src="/static/js/resources_controller.js"></script>
  </head>
  <body class="terminal-workstation">
    <!-- Sidebar -->
    <aside class="fiscal-sidebar">
      <div class="fiscal-logo-area">
        STOCKER<span>AI</span>
        <span
          style="
            font-size: 0.65rem;
            color: var(--fiscal-text-tertiary);
            font-family: var(--font-mono);
            margin-left: auto;
          "
          >v5.7.5</span
        >
      </div>
      <nav class="fiscal-nav">
        <a
          href="#dashboard"
          class="fiscal-nav-item active"
          data-module="dashboard"
        >
          <svg viewBox="0 0 24 24">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Monitor
        </a>
        <a
          href="#analysis"
          class="fiscal-nav-item"
          data-module="analysis"
        >
          <svg viewBox="0 0 24 24">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          Equity Dossier
        </a>
        <a
          href="#charting"
          class="fiscal-nav-item"
          data-module="charting"
        >
          <svg viewBox="0 0 24 24">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          Chart Desk
        </a>
        <a
          href="#screener"
          class="fiscal-nav-item"
          data-module="screener"
        >
          <svg viewBox="0 0 24 24">
            <polygon
              points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"
            ></polygon>
          </svg>
          Screener
        </a>
        <a
          href="#query"
          class="fiscal-nav-item"
          data-module="query"
        >
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          Query Tape
        </a>
        <a
          href="#resources"
          class="fiscal-nav-item"
          data-module="resources"
        >
          <svg viewBox="0 0 24 24">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path
              d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
            ></path>
          </svg>
          Resources
        </a>
      </nav>
      <div class="fiscal-nav" style="flex: 0">
        <a
          href="#"
          class="fiscal-nav-item"
          id="theme-toggle"
          onclick="window.App.toggleTheme(); return false;"
        >
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          Contrast
        </a>
        <a
          href="#settings"
          class="fiscal-nav-item"
          data-module="settings"
        >
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            ></path>
          </svg>
          System
        </a>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="fiscal-main-wrapper">
      <!-- Topbar -->
      <header class="fiscal-topbar">
        <div class="fiscal-search-container" style="position: relative;">
          <svg
            class="fiscal-search-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            class="fiscal-search-input"
            placeholder='Command: RUN AAPL, SEC MSFT, LAB NVDA, PORT, REPORTS (Press /)'
            id="global-search"
            autocomplete="off"
          />
          <div id="search-autocomplete" class="glass-panel" style="display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 1000; margin-top: 8px; max-height: 300px; overflow-y: auto; padding: 8px 0;"></div>
        </div>

        <div class="fiscal-topbar-actions">
          <svg
            class="fiscal-action-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <div class="fiscal-user-profile">
            <div class="fiscal-avatar">A</div>
            <span style="font-size: 0.9rem; font-weight: 500">Abdelli</span>
          </div>
        </div>
      </header>

      <!-- Market Ticker Tape -->
      <div class="fiscal-ticker-tape" id="ticker-tape">
        <div class="fiscal-ticker-inner" id="ticker-inner">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Content Area -->
      <main class="fiscal-content" id="module-container">
        <div
          style="
            display: flex;
            height: 100%;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
          "
        >
          <h1 style="font-size: 2rem">StockerAI Terminal</h1>
          <p style="color: var(--fiscal-text-secondary)">
            Run a ticker, open an intelligence page, or search the local database.
          </p>
        </div>
      </main>

      <!-- Bottom Tab Bar -->
      <footer class="fiscal-bottombar" id="tab-container">
        <!-- Managed by JS -->
      </footer>
    </div>

    <script>
      // Ticker tape
      (function loadTicker() {
        fetch("/api/ticker-tape")
          .then((r) => r.json())
          .then((data) => {
            const inner = document.getElementById("ticker-inner");
            if (!inner || !data.length) return;
            const render = (items) =>
              items
                .map((d) => {
                  const cls =
                    typeof d.pct === "number"
                      ? d.pct >= 0
                        ? "pos"
                        : "neg"
                      : "";
                  return (
                    '<div class="fiscal-ticker-item"><span class="fiscal-ticker-label">' +
                    d.label +
                    '</span><span class="fiscal-ticker-val">' +
                    d.val +
                    '</span><span class="fiscal-ticker-pct ' +
                    cls +
                    '">' +
                    (typeof d.pct === "number"
                      ? (d.pct >= 0 ? "+" : "") + d.pct.toFixed(2) + "%"
                      : "") +
                    "</span></div>"
                  );
                })
                .join("");
            inner.innerHTML = render(data) + render(data); // double for scroll
          })
          .catch(() => {});
      })();
    </script>
  </body>
</html>
